name: Sjekk av main

# Kjører testene og oppstartstesten (spillet åpnes i en ekte nettleser) på hver push og pull request.
# Hindrer at en feil som stopper hele siden (tom version.js, manglende modul, syntaksfeil) ligger ute uten at noen ser det.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tester (node)
        run: npm test
      - name: Installer Playwright
        run: |
          npm install -g playwright
          playwright install --with-deps chromium
      - name: Oppstartstest (nettleser)
        run: NODE_PATH=$(npm root -g) npm run boot
